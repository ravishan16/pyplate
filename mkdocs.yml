site_name: PyPlate FastAPI
site_description: Modern FastAPI application with Project Gutenberg dataset
site_author: Ravishankar Sivasubramaniam
repo_url: https://github.com/ravishan16/pyplate
repo_name: ravishan16/pyplate

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user/getting-started.md
    - API Usage: user/api-usage.md
    - Authentication: user/authentication.md
  - Developer Guide:
    - Setup & Installation: dev/setup.md
    - Architecture: dev/architecture.md
    - Configuration: dev/configuration.md
    - Database: dev/database.md
    - Secrets Management: dev/secrets-management.md
    - Contributing: dev/contributing.md
  - API Reference:
    - Overview: api/overview.md
    - Authentication: api/authentication.md
    - Books API: api/books.md
    - Authors API: api/authors.md